<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="456" viewBox="0 0 1200 456" role="img" aria-labelledby="t d">
  <title id="t">Chorus Docs</title>
  <desc id="d">Chorus Docs title with the speech-bubble C monogram, beside a stack of REST endpoint cards (GET /healthz, POST /api/v1/identities, GET /api/v1/threads, POST /api/v1/threads/{id}/messages) and a 201 Created response snippet.</desc>
  <style>
    :root { --bg:#ffffff; --sub:#f9fafb; --fg:#111827; --mut:#4b5563; --line:#eaecf0; --acc:#58a6ff; --accfg:#0b5cad; --tile:#0d1117; }
    @media (prefers-color-scheme: dark) { :root { --bg:#121417; --sub:#1a1d21; --fg:#e6edf3; --mut:#9198a1; --line:#30363d; --acc:#58a6ff; --accfg:#58a6ff; --tile:#0d1117; } }
    .bg { fill: var(--bg); stroke: var(--line); stroke-width: 2; }
    .card { fill: var(--sub); stroke: var(--line); stroke-width: 2; }
    .chip { fill: none; stroke: var(--line); stroke-width: 2; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .fg { fill: var(--fg); } .mut { fill: var(--mut); } .accfg { fill: var(--accfg); }
    .badge-post { fill: var(--acc); fill-opacity: .16; stroke: var(--acc); stroke-width: 2; }
    .badge-get { fill: none; stroke: var(--mut); stroke-width: 2; }
  </style>
  <rect class="bg" x="1" y="1" width="1198" height="454" rx="20"/>

  <g id="brand" transform="translate(64 56)">
    <rect width="72" height="72" rx="16" fill="var(--tile)" stroke="var(--line)" stroke-width="2"/>
    <g transform="translate(40 36) scale(0.138)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 90 -165 A 185 185 0 1 0 -150 75 L -205 160 L -115 145 A 185 185 0 0 0 90 165" stroke="#58a6ff" stroke-width="36"/>
      <path d="M 60 -105 A 120 120 0 1 0 60 105" stroke="#f0f6fc" stroke-width="28"/>
    </g>
    <text class="mono mut" x="92" y="46" font-size="22">docs.joinchorus.app</text>
  </g>

  <g id="title-block" transform="translate(64 0)">
    <text class="sans fg" x="0" y="226" font-size="76" font-weight="800" letter-spacing="-2">Chorus Docs</text>
    <text class="sans mut" x="0" y="284" font-size="26">REST API reference, architecture</text>
    <text class="sans mut" x="0" y="318" font-size="26">diagrams and RFCs.</text>
  </g>

  <g id="meta" transform="translate(64 360)" class="mono" font-size="20">
    <rect class="chip" x="0" y="0" width="176" height="44" rx="22"/><text class="fg" x="88" y="29" text-anchor="middle">v0.1.0-alpha</text>
    <rect class="chip" x="188" y="0" width="164" height="44" rx="22"/><text class="fg" x="270" y="29" text-anchor="middle">7 endpoints</text>
    <rect class="chip" x="364" y="0" width="116" height="44" rx="22"/><text class="fg" x="422" y="29" text-anchor="middle">RFC-001</text>
  </g>

  <g id="endpoints" transform="translate(616 48)" class="mono" font-size="20">
    <g>
      <rect class="card" width="520" height="64" rx="14"/>
      <rect class="badge-get" x="18" y="14" width="76" height="36" rx="10"/>
      <text class="mut" x="56" y="39" text-anchor="middle" font-weight="700">GET</text>
      <text class="fg" x="112" y="39">/healthz</text>
    </g>
    <g transform="translate(0 76)">
      <rect class="card" width="520" height="64" rx="14"/>
      <rect class="badge-post" x="18" y="14" width="76" height="36" rx="10"/>
      <text class="accfg" x="56" y="39" text-anchor="middle" font-weight="700">POST</text>
      <text class="fg" x="112" y="39">/api/v1/identities</text>
    </g>
    <g transform="translate(0 152)">
      <rect class="card" width="520" height="64" rx="14"/>
      <rect class="badge-get" x="18" y="14" width="76" height="36" rx="10"/>
      <text class="mut" x="56" y="39" text-anchor="middle" font-weight="700">GET</text>
      <text class="fg" x="112" y="39">/api/v1/threads</text>
    </g>
    <g transform="translate(0 228)">
      <rect class="card" width="520" height="64" rx="14"/>
      <rect class="badge-post" x="18" y="14" width="76" height="36" rx="10"/>
      <text class="accfg" x="56" y="39" text-anchor="middle" font-weight="700">POST</text>
      <text class="fg" x="112" y="39">/api/v1/threads/{id}/messages</text>
    </g>
    <g transform="translate(0 312)">
      <rect class="card" width="520" height="56" rx="14"/>
      <text class="mut" x="20" y="36">201</text>
      <text class="fg" x="68" y="36">{ "id": "usr_7f8a91b2c3d4e5f6" }</text>
    </g>
  </g>
</svg>
