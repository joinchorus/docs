name: Documentation Firebase Hosting CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_verify:
    name: Build & Verify Technical Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Documentation Assets
        run: |
          npm run build
          test -f public/index.html

  deploy_firebase_hosting:
    name: Deploy to Firebase Hosting (docs.joinchorus.app)
    needs: build_and_verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Firebase Secret
        id: check_secret
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHORUS_DOCS }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "SECRET_EXISTS=false" >> $GITHUB_ENV
            echo "::warning ::FIREBASE_SERVICE_ACCOUNT_CHORUS_DOCS secret is missing in GitHub repository secrets. Deployment skipped."
          else
            echo "SECRET_EXISTS=true" >> $GITHUB_ENV
          fi

      - name: Deploy to Firebase Hosting
        if: env.SECRET_EXISTS == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHORUS_DOCS }}'
          channelId: live
          projectId: chorus-chat-app
          target: chorus-docs
